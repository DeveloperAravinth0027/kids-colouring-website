version: '3.8'

# ============================================================
# Kids Colouring Book E-commerce Platform
# Docker Compose — Local Development
# Run: docker-compose up -d
# ============================================================

services:

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: kidscolour-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: kids_colour_db
      MYSQL_USER: kidscolour_user
      MYSQL_PASSWORD: kidscolour_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    networks:
      - kidscolour-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kidscolour-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: kids_colour_db
      DB_USERNAME: kidscolour_user
      DB_PASSWORD: kidscolour_pass
      JWT_SECRET: ${JWT_SECRET:-your-256-bit-secret-change-in-production}
      JWT_EXPIRATION: 900000
      JWT_REFRESH_EXPIRATION: 604800000
      MAIL_HOST: smtp.gmail.com
      MAIL_PORT: 587
      MAIL_USERNAME: ${MAIL_USERNAME:-your-email@gmail.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-your-app-password}
      AWS_ACCESS_KEY: ${AWS_ACCESS_KEY:-your-aws-access-key}
      AWS_SECRET_KEY: ${AWS_SECRET_KEY:-your-aws-secret-key}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-kidscolour-pdfs}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-your-cloud-name}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-your-api-key}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-your-api-secret}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_xxxxx}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-your-secret}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_xxxxx}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_xxxxx}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-your-phone-id}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-your-token}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-your-google-client-id}
      FRONTEND_URL: http://localhost:5173
    ports:
      - "8080:8080"
    networks:
      - kidscolour-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # React Frontend (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kidscolour-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api
      VITE_RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_xxxxx}
      VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-your-google-client-id}
    networks:
      - kidscolour-network

volumes:
  mysql_data:
    name: kidscolour-mysql-data

networks:
  kidscolour-network:
    name: kidscolour-network
    driver: bridge
