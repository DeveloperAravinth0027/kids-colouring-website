<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF6B6B"/>
      <stop offset="1" stop-color="#9B5DE5"/>
    </linearGradient>
    <mask id="thumbhole">
      <rect width="512" height="512" fill="#fff"/>
      <circle cx="312" cy="312" r="34" fill="#000"/>
    </mask>
  </defs>

  <!-- Brand tile -->
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>

  <!-- Artist palette (white blob with a thumb hole punched out) -->
  <ellipse cx="252" cy="248" rx="156" ry="132" fill="#ffffff" mask="url(#thumbhole)"/>

  <!-- Paint blobs -->
  <circle cx="196" cy="214" r="24" fill="#FF6B6B"/>
  <circle cx="256" cy="188" r="24" fill="#FFD93D"/>
  <circle cx="318" cy="208" r="24" fill="#4D96FF"/>
  <circle cx="196" cy="290" r="24" fill="#6BCB77"/>
  <circle cx="256" cy="300" r="20" fill="#9B5DE5"/>
</svg>
