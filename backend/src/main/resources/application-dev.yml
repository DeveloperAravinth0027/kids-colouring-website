spring:
  jpa:
    hibernate:
      # Schema is owned by db/schema-init.sql (self-provisioning), not Hibernate.
      # 'validate' crashed on any DB whose schema wasn't hand-loaded (e.g. a fresh
      # Railway MySQL) — 'none' lets the init script create what's missing instead.
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Create any missing tables on startup (CREATE TABLE IF NOT EXISTS), so this
  # profile also works against a brand-new database. Safe/no-op on re-runs.
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-init.sql
      continue-on-error: true

logging:
  level:
    root: INFO
    com.kidscolour: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Dev specific properties if needed
app:
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
