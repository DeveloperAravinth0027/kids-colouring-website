<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reset Your Password</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f9fafb; margin: 0; padding: 20px; color: #374151; }
        .container { max-width: 600px; margin: 0 auto; background-color: #ffffff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h1 { color: #9B5DE5; margin-top: 0; }
        .btn { display: inline-block; background-color: #FF6B6B; color: #ffffff; text-decoration: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; margin-top: 20px; }
        .footer { margin-top: 40px; font-size: 14px; color: #6b7280; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Password Reset</h1>
        <p>Hello,</p>
        <p>We received a request to reset your password. You can do this by clicking the button below:</p>
        
        <a th:href="${resetUrl}" class="btn">Reset Password</a>
        
        <p style="margin-top: 30px;">If you didn't request a password reset, you can safely ignore this email. This link will expire in 1 hour.</p>
        
        <div class="footer">
            <p>&copy; <span th:text="${#dates.year(#dates.createNow())}">2026</span> Kids Colouring Book. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
